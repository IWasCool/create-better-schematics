plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

version = mod_version
group = mod_group_id

repositories {
    maven { url = 'https://maven.blamejared.com' }
    maven { url = 'https://maven.createmod.net' }
    maven { url = 'https://api.modrinth.com/maven' }
}

base {
    archivesName = mod_id
}

// Mojang ships Java 21 to end users in 1.21.1, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
sourceSets.main.java.srcDir('common/src/main/java')
sourceSets.main.java.srcDir('compatibility/src/main/java')

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
        }

        server {
            server()
            programArgument '--nogui'
        }

        configureEach {
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    compileOnly 'mezz.jei:jei-1.21.1-neoforge:19.53.0.426'
    // Create 6.0.10, matching the supported runtime.
    compileOnly 'maven.modrinth:create:UjX6dr61'
    compileOnly 'org.spongepowered:mixin:0.8.5'
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    compileOnly "net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}"
    localRuntime "net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}"
    localRuntime 'maven.modrinth:create:UjX6dr61'
}

// Generate loader metadata from gradle.properties.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata

neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

// Keep packaged languages consistent when adding or updating translations.
def languageFiles = fileTree('src/main/resources/assets/create_better_schematics/lang') {
    include '*.json'
}
def englishLanguage = file('src/main/resources/assets/create_better_schematics/lang/en_us.json')
tasks.register('validateTranslations') {
    inputs.files(languageFiles)
    doLast {
        def parser = new groovy.json.JsonSlurper()
        def english = parser.parse(englishLanguage, 'UTF-8')
        def arguments = { String value ->
            def remaining = value.replaceAll(/%(?:[1-9]\d*\$)?s|%%/, '')
            if (remaining.contains('%'))
                throw new GradleException('Invalid translation placeholder: ' + value)
            def implicit = 0
            def indices = []
            def matcher = value =~ /%(?:([1-9]\d*)\$)?s|%%/
            matcher.each { match ->
                if (match[0] != '%%')
                    indices.add(match[1] ? match[1].toInteger() : ++implicit)
            }
            indices.sort()
        }
        languageFiles.each { language ->
            def entries = parser.parse(language, 'UTF-8')
            if (entries.keySet() != english.keySet())
                throw new GradleException('Translation keys differ: ' + language.name)
            entries.each { key, value ->
                if (!(value instanceof String) || value.trim().isEmpty() || value.contains('\uFFFD')
                        || arguments(value) != arguments(english[key]))
                    throw new GradleException('Invalid translation: ' + language.name + ': ' + key)
            }
        }
        logger.lifecycle('Validated {} keys across {} language file(s)', english.size(), languageFiles.files.size())
    }
}
tasks.named('processResources').configure { dependsOn 'validateTranslations' }
