plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

version = mod_version
group = mod_group_id

repositories {
    maven { url = 'https://maven.blamejared.com' }
    maven { url = 'https://maven.createmod.net' }
    maven { url = 'https://api.modrinth.com/maven' }
    maven { url = 'https://maven.architectury.dev' }
}

base {
    archivesName = mod_id
}

// Mojang ships Java 21 to end users in 1.21.1, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
sourceSets.main.java.srcDir('common/src/main/java')
sourceSets.main.java.srcDir('compatibility/src/main/java')

// Tests and fixtures are available only in explicitly requested development runs.
def gameTestSources = ['gameTests', 'compatTests', 'nativeCompatibilityTests']
        .any { providers.gradleProperty(it).isPresent() }
if (gameTestSources) {
    sourceSets.main.java.srcDir('src/testFixtures/java')
    sourceSets.main.resources.srcDir('src/testFixtures/resources')
}

tasks.named('jar', Jar).configure {
    exclude('**/gametest/**', '**/compat_gametest/**', '**/client_tests/**', '**/native_tests/**', '**/testsupport/**')
    exclude('fixtures/**', 'data/create_better_schematics/structure/empty.nbt')
}

def compatibilityTests = providers.gradleProperty('compatTests').isPresent()
if (compatibilityTests) {
    sourceSets {
        compatTest {
            java.exclude('**/*Client*.java')
            compileClasspath += sourceSets.main.output
            runtimeClasspath += sourceSets.main.output
        }
    }
    configurations {
        compatTestImplementation.extendsFrom implementation
        compatTestCompileOnly.extendsFrom compileOnly
        compatTestRuntimeOnly.extendsFrom runtimeClasspath
    }
}

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

if (compatibilityTests) {
    neoForge.addModdingDependenciesTo(sourceSets.compatTest)
    neoForge.mods {
        better_schematics_compat_tests { sourceSet sourceSets.compatTest }
    }
    neoForge.runs.gameTestServer {
        sourceSet = sourceSets.compatTest
        systemProperty 'neoforge.enabledGameTestNamespaces', 'create_better_schematics,better_schematics_compat_tests'
    }
    // Compile and run against the selected pack's jars when available, without also loading pinned copies.
    def compatibilityDependency = { String pattern, String pinned ->
        def selected = providers.gradleProperty('compatModsDir').isPresent()
                ? fileTree(dir: providers.gradleProperty('compatModsDir').get(), include: [pattern]).files
                : []
        if (selected.size() > 1)
            throw new GradleException('Multiple compatibility test dependencies match ' + pattern + ': ' + selected)
        selected.isEmpty() ? pinned : files(selected)
    }
    dependencies {
        compatTestImplementation compatibilityDependency('powergrid-*.jar', 'maven.modrinth:power-grid:jCkPHjmP')
        compatTestImplementation compatibilityDependency('architectury-*.jar', 'dev.architectury:architectury-neoforge:13.0.11')
        compatTestImplementation compatibilityDependency('createaddition-*.jar', 'maven.modrinth:createaddition:qPr8V4G2')
        compatTestImplementation compatibilityDependency('toms_storage-*.jar', 'maven.modrinth:toms-storage:WQAMoIMC')
        if (providers.gradleProperty('compatFlywheelVersion').isPresent())
            compatTestRuntimeOnly "dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${providers.gradleProperty('compatFlywheelVersion').get()}"
        if (providers.gradleProperty('compatModsDir').isPresent()) {
            compatTestRuntimeOnly fileTree(dir: providers.gradleProperty('compatModsDir').get(),
                    include: ['*.jar'], exclude: ["create-${minecraft_version}-*.jar", 'create_better_schematics-*.jar',
                            'powergrid-*.jar', 'architectury-*.jar', 'createaddition-*.jar', 'toms_storage-*.jar'])
        }
    }
    tasks.register('compatTestJar', Jar) {
        archiveClassifier = 'compat-tests'
        from sourceSets.compatTest.output
    }
}

// NeoForge can exit normally after a mod-loading error. Require the GameTest result as well.
def gameTestLog = layout.projectDirectory.file('run/logs/latest.log')
tasks.named('runGameTestServer').configure {
    doFirst { gameTestLog.asFile.delete() }
    doLast {
        if (!gameTestLog.asFile.exists() || !(gameTestLog.asFile.text =~ /All \d+ required tests passed/).find())
            throw new GradleException('GameTest server did not report a passing test run; inspect run/logs/latest.log')
    }
}
if (providers.gradleProperty('compatModsDir').isPresent()) {
    def loggingArguments = new PortableLoggingArguments(
            configurationUri: file('build/moddev/gameTestServerLog4j2.xml').toURI().toASCIIString())
    tasks.named('runGameTestServer', JavaExec).configure {
        maxHeapSize = '4G'
        doFirst { task -> task.jvmArgumentProviders.add(loggingArguments) }
    }
}

class PortableLoggingArguments implements org.gradle.process.CommandLineArgumentProvider {
    @Input String configurationUri

    @Override
    Iterable<String> asArguments() {
        return ['-Dlog4j.configurationFile=' + configurationUri, '-Dlog4j2.configurationFile=' + configurationUri]
    }
}

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    compileOnly 'mezz.jei:jei-1.21.1-neoforge:19.53.0.426'
    // Exact Create 6.0.10 distribution used for the compatibility tests.
    compileOnly 'maven.modrinth:create:UjX6dr61'
    compileOnly 'org.spongepowered:mixin:0.8.5'
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    compileOnly "net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}"
    localRuntime "net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}"
    localRuntime 'maven.modrinth:create:UjX6dr61'
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata

// Load a separate test mod with Better Schematics entirely absent, including its mixins.
if (providers.gradleProperty('nativeCompatibilityTests').isPresent()) {
    sourceSets { nativeCompatibilityTest {} }
    configurations {
        nativeCompatibilityTestImplementation.extendsFrom implementation
        nativeCompatibilityTestCompileOnly.extendsFrom compileOnly
        nativeCompatibilityTestRuntimeOnly.extendsFrom runtimeClasspath
    }
    neoForge.addModdingDependenciesTo(sourceSets.nativeCompatibilityTest)
    neoForge.mods {
        better_schematics_native_tests { sourceSet sourceSets.nativeCompatibilityTest }
    }
    neoForge.runs {
        nativeGameTestServer {
            type = 'gameTestServer'
            sourceSet = sourceSets.nativeCompatibilityTest
            loadedMods = [project.neoForge.mods.getByName('better_schematics_native_tests')]
            gameDirectory = layout.buildDirectory.dir('native-compatibility/run')
            systemProperty 'neoforge.enabledGameTestNamespaces', 'better_schematics_native_tests'
            systemProperty 'betterSchematics.sharedFixtures', layout.buildDirectory.dir('shareable-fixtures').get().asFile.absolutePath
        }
    }
    def nativeGameTestLog = layout.buildDirectory.file('native-compatibility/run/logs/latest.log').get().asFile
    tasks.named('runNativeGameTestServer').configure {
        dependsOn tasks.named('runGameTestServer')
        doLast {
            if (!nativeGameTestLog.exists() || !(nativeGameTestLog.text =~ /All \d+ required tests passed/).find())
                throw new GradleException('Create-only compatibility tests did not pass; inspect ' + nativeGameTestLog)
        }
    }
}
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
