modLoader="javafml"

loaderVersion="${loader_version_range}"

license="${mod_license}"
issueTrackerURL="https://github.com/IWasCool/create-better-schematics/issues"

[[mods]]

modId="${mod_id}"

version="${mod_version}"

displayName="${mod_name}"
displayURL="https://github.com/IWasCool/create-better-schematics"

authors="Izcool"

description='''
Preserves Create schematic machine settings, Factory Gauge setups, filters, mechanical arm targets, and belt casings.
Adds selective Schematicannon building, JEI material bookmarks, Power Grid wires, and Transmission & Linkage universal-joint rods.
Supports addon configuration profiles and schematic transfers between Forge 1.20.1 and NeoForge 1.21.1.
'''

[[mixins]]
config="${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neo_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="create"
    type="required"
    versionRange="[6.0.10,6.1)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
