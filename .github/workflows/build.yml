name: Build

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.loader }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - loader: NeoForge
            command: bash ./gradlew build
            artifacts: build/libs/*.jar
          - loader: Forge
            command: bash ./gradlew -p forge build
            artifacts: forge/build/libs/*.jar
          - loader: Fabric
            command: bash ./fabric/gradlew -p fabric build
            artifacts: fabric/build/libs/*.jar
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: ${{ matrix.command }}
      - name: Upload JARs
        uses: actions/upload-artifact@v4
        with:
          name: better-schematics-${{ matrix.loader }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error
