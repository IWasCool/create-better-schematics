plugins {
    id 'java-library'
    id 'net.neoforged.moddev.legacyforge' version '2.0.148'
}

group = 'com.ourcreationstudios.create_better_schematics'
version = '0.0.5'
base.archivesName = 'create_better_schematics-forge-1.20.1'
java.toolchain.languageVersion = JavaLanguageVersion.of(17)
sourceSets.main.java.srcDir('../common/src/main/java')
sourceSets.main.java.srcDir('../compatibility/src/main/java')

sourceSets {
    gametest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
configurations {
    gametestImplementation.extendsFrom implementation
    gametestCompileOnly.extendsFrom compileOnly
    gametestRuntimeOnly.extendsFrom runtimeOnly
}
repositories {
    maven { url = 'https://maven.createmod.net' }
    maven { url = 'https://maven.tterrag.com' }
    maven { url = 'https://api.modrinth.com/maven' }
    maven { url = 'https://maven.architectury.dev' }
}
legacyForge {
    version = '1.20.1-47.4.10'
    addModdingDependenciesTo(sourceSets.gametest)
    mods {
        create_better_schematics { sourceSet sourceSets.main }
        better_schematics_tests { sourceSet sourceSets.gametest }
    }
    runs {
        client {
            client()
            loadedMods = [mods.create_better_schematics]
        }
        gameTestServer {
            type = 'gameTestServer'
            sourceSet = sourceSets.gametest
            gameDirectory = layout.projectDirectory.dir('run-gametest')
            systemProperty 'forge.enabledGameTestNamespaces', 'better_schematics_tests'
        }
    }
}
dependencies {
    modImplementation 'com.simibubi.create:create-1.20.1:6.0.8-289:slim'
    modImplementation 'net.createmod.ponder:Ponder-Forge-1.20.1:1.0.91'
    modImplementation 'com.tterrag.registrate:Registrate:MC1.20-1.3.3'
    modCompileOnly 'dev.engine-room.flywheel:flywheel-forge-api-1.20.1:1.0.5'
    modRuntimeOnly 'dev.engine-room.flywheel:flywheel-forge-1.20.1:1.0.5'
    modRuntimeOnly 'io.github.llamalad7:mixinextras-forge:0.4.1'
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}
if (providers.gradleProperty('compatTests').isPresent()) {
    dependencies {
        modRuntimeOnly 'maven.modrinth:power-grid:CBWW1upo'
        modRuntimeOnly 'dev.architectury:architectury-forge:9.2.14'
    }
}
mixin {
    add sourceSets.main, 'create_better_schematics_forge.refmap.json'
    config 'create_better_schematics_forge.mixins.json'
}
tasks.named('jar', Jar) {
    manifest.attributes('MixinConfigs': 'create_better_schematics_forge.mixins.json')
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

// Forge can exit successfully after a mod-loading error; require an actual passing test result.
tasks.named('runGameTestServer').configure {
    doLast {
        def log = file('run-gametest/logs/latest.log')
        if (!log.exists() || !(log.text =~ /All \d+ required tests passed/).find())
            throw new GradleException('Forge compatibility tests did not pass; inspect ' + log)
    }
}
